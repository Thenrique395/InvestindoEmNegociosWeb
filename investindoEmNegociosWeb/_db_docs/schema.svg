<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; }
      .title { font: 600 14px Arial, sans-serif; fill: #111827; }
      .field { font: 12px Arial, sans-serif; fill: #374151; }
      .rel { stroke: #6b7280; stroke-width: 1.2; }
      .rel.dashed { stroke-dasharray: 5 4; }
      .label { font: 11px Arial, sans-serif; fill: #6b7280; }
    </style>
  </defs>

  <!-- Column 1 -->
  <rect class="box" x="40" y="40" width="300" height="200" rx="8"/>
  <text class="title" x="56" y="64">user_profiles</text>
  <text class="field" x="56" y="84">id (PK)</text>
  <text class="field" x="56" y="100">user_id (FK)</text>
  <text class="field" x="56" y="116">full_name, document, phone</text>
  <text class="field" x="56" y="132">birth_date, avatar_url</text>
  <text class="field" x="56" y="148">city, state, country</text>
  <text class="field" x="56" y="164">language, currency</text>
  <text class="field" x="56" y="180">notify flags + days_before</text>

  <rect class="box" x="40" y="270" width="300" height="140" rx="8"/>
  <text class="title" x="56" y="294">user_onboarding</text>
  <text class="field" x="56" y="314">id (PK)</text>
  <text class="field" x="56" y="330">user_id (FK)</text>
  <text class="field" x="56" y="346">step, completed</text>
  <text class="field" x="56" y="362">created_at, updated_at</text>

  <rect class="box" x="40" y="430" width="300" height="170" rx="8"/>
  <text class="title" x="56" y="454">notification_settings</text>
  <text class="field" x="56" y="474">id (PK)</text>
  <text class="field" x="56" y="490">income/expense flags</text>
  <text class="field" x="56" y="506">card/month/goal flags</text>
  <text class="field" x="56" y="522">days_before values</text>
  <text class="field" x="56" y="538">created_at, updated_at</text>

  <rect class="box" x="40" y="620" width="300" height="200" rx="8"/>
  <text class="title" x="56" y="644">user_notifications</text>
  <text class="field" x="56" y="664">id (PK)</text>
  <text class="field" x="56" y="680">user_id (FK)</text>
  <text class="field" x="56" y="696">plan_id?, installment_id?</text>
  <text class="field" x="56" y="712">kind, money_type?</text>
  <text class="field" x="56" y="728">title, message, due_date?</text>
  <text class="field" x="56" y="744">created_at, read_at?</text>

  <!-- Column 2 -->
  <rect class="box" x="420" y="40" width="300" height="170" rx="8"/>
  <text class="title" x="436" y="64">users</text>
  <text class="field" x="436" y="84">id (PK)</text>
  <text class="field" x="436" y="100">name, email, password_hash</text>
  <text class="field" x="436" y="116">role, is_active</text>
  <text class="field" x="436" y="132">last_login_at, lockout_until</text>
  <text class="field" x="436" y="148">created_at, updated_at</text>

  <rect class="box" x="420" y="240" width="300" height="140" rx="8"/>
  <text class="title" x="436" y="264">refresh_tokens</text>
  <text class="field" x="436" y="284">id (PK)</text>
  <text class="field" x="436" y="300">user_id (FK)</text>
  <text class="field" x="436" y="316">token_hash, expires_at</text>
  <text class="field" x="436" y="332">revoked_at?, replaced_by?</text>

  <rect class="box" x="420" y="400" width="300" height="170" rx="8"/>
  <text class="title" x="436" y="424">audit_logs</text>
  <text class="field" x="436" y="444">id (PK)</text>
  <text class="field" x="436" y="460">user_id (FK, nullable)</text>
  <text class="field" x="436" y="476">action, entity, entity_id?</text>
  <text class="field" x="436" y="492">ip_address?, user_agent?</text>
  <text class="field" x="436" y="508">metadata?, created_at</text>

  <!-- Column 3 -->
  <rect class="box" x="800" y="40" width="300" height="160" rx="8"/>
  <text class="title" x="816" y="64">categories</text>
  <text class="field" x="816" y="84">id (PK)</text>
  <text class="field" x="816" y="100">user_id? (FK)</text>
  <text class="field" x="816" y="116">name, applies_to</text>
  <text class="field" x="816" y="132">is_active, created_at</text>

  <rect class="box" x="800" y="220" width="300" height="140" rx="8"/>
  <text class="title" x="816" y="244">card_brands</text>
  <text class="field" x="816" y="264">id (PK)</text>
  <text class="field" x="816" y="280">name, code</text>
  <text class="field" x="816" y="296">is_active</text>

  <rect class="box" x="800" y="380" width="300" height="200" rx="8"/>
  <text class="title" x="816" y="404">cards</text>
  <text class="field" x="816" y="424">id (PK)</text>
  <text class="field" x="816" y="440">user_id (FK)</text>
  <text class="field" x="816" y="456">brand_id (FK)</text>
  <text class="field" x="816" y="472">nickname, last4, bank?</text>
  <text class="field" x="816" y="488">credit_limit</text>
  <text class="field" x="816" y="504">statement_close_day, due_day</text>

  <rect class="box" x="800" y="600" width="300" height="140" rx="8"/>
  <text class="title" x="816" y="624">payment_methods</text>
  <text class="field" x="816" y="644">id (PK)</text>
  <text class="field" x="816" y="660">name</text>
  <text class="field" x="816" y="676">is_active</text>

  <!-- Column 4 -->
  <rect class="box" x="1180" y="40" width="300" height="220" rx="8"/>
  <text class="title" x="1196" y="64">money_plans</text>
  <text class="field" x="1196" y="84">id (PK)</text>
  <text class="field" x="1196" y="100">user_id (FK)</text>
  <text class="field" x="1196" y="116">type, title, amount</text>
  <text class="field" x="1196" y="132">schedule, frequency?</text>
  <text class="field" x="1196" y="148">installments_count?</text>
  <text class="field" x="1196" y="164">category_id?, card_id?</text>
  <text class="field" x="1196" y="180">default_payment_method_id?</text>

  <rect class="box" x="1180" y="280" width="300" height="170" rx="8"/>
  <text class="title" x="1196" y="304">money_installments</text>
  <text class="field" x="1196" y="324">id (PK)</text>
  <text class="field" x="1196" y="340">plan_id (FK)</text>
  <text class="field" x="1196" y="356">user_id (FK)</text>
  <text class="field" x="1196" y="372">installment_no, due_date</text>
  <text class="field" x="1196" y="388">amount, status</text>

  <rect class="box" x="1180" y="470" width="300" height="160" rx="8"/>
  <text class="title" x="1196" y="494">money_payments</text>
  <text class="field" x="1196" y="514">id (PK)</text>
  <text class="field" x="1196" y="530">installment_id (FK)</text>
  <text class="field" x="1196" y="546">user_id (FK)</text>
  <text class="field" x="1196" y="562">paid_at, paid_amount</text>
  <text class="field" x="1196" y="578">method_id? (logical)</text>

  <!-- Column 5 -->
  <rect class="box" x="1480" y="40" width="300" height="170" rx="8"/>
  <text class="title" x="1496" y="64">goals</text>
  <text class="field" x="1496" y="84">id (PK)</text>
  <text class="field" x="1496" y="100">user_id (FK)</text>
  <text class="field" x="1496" y="116">title, target_amount</text>
  <text class="field" x="1496" y="132">current_amount, year</text>
  <text class="field" x="1496" y="148">status, target_date?</text>

  <rect class="box" x="1480" y="230" width="300" height="150" rx="8"/>
  <text class="title" x="1496" y="254">goal_contributions</text>
  <text class="field" x="1496" y="274">id (PK)</text>
  <text class="field" x="1496" y="290">goal_id (FK)</text>
  <text class="field" x="1496" y="306">user_id (FK)</text>
  <text class="field" x="1496" y="322">amount, date, note?</text>

  <rect class="box" x="1480" y="400" width="300" height="120" rx="8"/>
  <text class="title" x="1496" y="424">investment_goals</text>
  <text class="field" x="1496" y="444">id (PK)</text>
  <text class="field" x="1496" y="460">user_id (FK)</text>
  <text class="field" x="1496" y="476">target_amount</text>

  <rect class="box" x="1480" y="540" width="300" height="200" rx="8"/>
  <text class="title" x="1496" y="564">investment_positions</text>
  <text class="field" x="1496" y="584">id (PK)</text>
  <text class="field" x="1496" y="600">user_id (FK)</text>
  <text class="field" x="1496" y="616">type, asset</text>
  <text class="field" x="1496" y="632">quantity, avg_price</text>
  <text class="field" x="1496" y="648">opened_at, account</text>

  <rect class="box" x="1480" y="760" width="300" height="150" rx="8"/>
  <text class="title" x="1496" y="784">investment_movements</text>
  <text class="field" x="1496" y="804">id (PK)</text>
  <text class="field" x="1496" y="820">position_id (FK)</text>
  <text class="field" x="1496" y="836">type, quantity, price</text>
  <text class="field" x="1496" y="852">date, note?</text>

  <rect class="box" x="1480" y="930" width="300" height="120" rx="8"/>
  <text class="title" x="1496" y="954">institutions</text>
  <text class="field" x="1496" y="974">id (PK)</text>
  <text class="field" x="1496" y="990">name, type</text>
  <text class="field" x="1496" y="1006">is_active</text>

  <!-- Relationships -->
  <line class="rel" x1="420" y1="120" x2="340" y2="120"/>
  <line class="rel" x1="420" y1="300" x2="340" y2="320"/>
  <line class="rel" x1="420" y1="460" x2="340" y2="700"/>
  <line class="rel" x1="420" y1="300" x2="340" y2="300"/>
  <line class="rel" x1="420" y1="120" x2="800" y2="460"/>
  <line class="rel" x1="420" y1="120" x2="800" y2="120"/>
  <line class="rel" x1="420" y1="120" x2="1180" y2="120"/>
  <line class="rel" x1="420" y1="120" x2="1180" y2="320"/>
  <line class="rel" x1="420" y1="120" x2="1180" y2="520"/>
  <line class="rel" x1="420" y1="120" x2="1480" y2="120"/>
  <line class="rel" x1="420" y1="120" x2="1480" y2="280"/>
  <line class="rel" x1="420" y1="120" x2="1480" y2="460"/>
  <line class="rel" x1="420" y1="120" x2="1480" y2="620"/>

  <line class="rel" x1="800" y1="300" x2="800" y2="420"/>
  <line class="rel" x1="1100" y1="120" x2="1180" y2="120"/>
  <line class="rel" x1="1100" y1="460" x2="1180" y2="160"/>
  <line class="rel" x1="1180" y1="320" x2="1180" y2="520"/>
  <line class="rel" x1="1480" y1="120" x2="1480" y2="280"/>
  <line class="rel" x1="1480" y1="620" x2="1480" y2="820"/>

  <line class="rel dashed" x1="1100" y1="660" x2="1180" y2="200"/>
  <line class="rel dashed" x1="1100" y1="660" x2="1180" y2="560"/>

  <text class="label" x="1110" y="652">logical</text>
  <text class="label" x="1110" y="678">FKs</text>
</svg>
