<section class="forgot-shell">
  <div class="forgot-shell__aura forgot-shell__aura--left" aria-hidden="true"></div>
  <div class="forgot-shell__aura forgot-shell__aura--right" aria-hidden="true"></div>

  <article class="forgot-card">
    <p class="eyebrow">Recuperação de senha</p>
    <h1>Esqueci minha senha</h1>
    <p class="muted">Digite o e-mail da sua conta para receber o link de redefinição.</p>

    @if (success) {
      <div class="state state--success">
        Enviamos as instruções para seu E-mail.
        <a routerLink="/login">Voltar para login</a>
      </div>
    }

    @if (!success) {
      <form class="form" (ngSubmit)="onSubmit()">
        <label>
          E-mail
          <input [(ngModel)]="email" name="email" type="email" placeholder="E-mail" required autocomplete="email" />
        </label>
        @if (formError) {
          <p class="error-text">{{ formError }}</p>
        }
        <div class="actions">
          <button type="submit" class="btn-primary" [disabled]="loading">
            {{ loading ? 'Enviando...' : 'Enviar link de recuperação' }}
          </button>
          <a routerLink="/login" class="ghost-link">Voltar para login</a>
        </div>
      </form>
    }
  </article>
</section>
