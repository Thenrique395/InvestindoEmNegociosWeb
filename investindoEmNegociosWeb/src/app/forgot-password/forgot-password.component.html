<section class="panel">
  <div class="panel__header">
    <div>
      <p class="eyebrow">Recuperação de senha</p>
      <h2>Esqueci minha senha</h2>
      <p class="muted">Informe o e-mail da sua conta para receber o link de redefinição.</p>
    </div>
  </div>

  <form class="form" (ngSubmit)="onSubmit()">
    <label>
      E-mail
      <input [(ngModel)]="email" name="email" type="email" placeholder="seu@email.com" required />
    </label>

    <div class="actions">
      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Enviando...' : 'Enviar link de recuperação' }}
      </button>
      <a routerLink="/login" class="ghost-link">Voltar para login</a>
    </div>
  </form>
</section>
