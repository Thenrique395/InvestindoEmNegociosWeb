<section class="forgot-shell">
  <div class="forgot-shell__aura forgot-shell__aura--left" aria-hidden="true"></div>
  <div class="forgot-shell__aura forgot-shell__aura--right" aria-hidden="true"></div>

  <article class="forgot-card">
    <div class="forgot-head">
      <div class="forgot-mark" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p class="forgot-eyebrow">Recuperação de senha</p>
      <h1>Esqueci minha senha</h1>
      <p>Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link de redefinição.</p>
    </div>

    @if (success) {
      <div class="forgot-state forgot-state--success">
        Enviamos as instruções para o e-mail informado.
        <a routerLink="/login">Voltar para login</a>
      </div>
    }

    @if (!success) {
      <form class="forgot-form" (ngSubmit)="onSubmit()">
        <label class="forgot-form__field">
          <span>E-mail</span>
          <div class="forgot-form__input-shell">
            <input
              [(ngModel)]="email"
              name="email"
              type="email"
              placeholder="Digite seu e-mail"
              autocomplete="email"
              required />
          </div>
        </label>

        @if (formError) {
          <p class="forgot-form__error" role="alert">{{ formError }}</p>
        }

        <button type="submit" class="forgot-form__submit" [disabled]="loading">
          <span class="forgot-form__submit-icon" aria-hidden="true">→</span>
          <span>{{ loading ? 'Enviando...' : 'Enviar link de recuperação' }}</span>
        </button>

        <p class="forgot-form__back">
          <a routerLink="/login">Voltar para login</a>
        </p>
      </form>
    }
  </article>
</section>
