<section class="investments">
  <section class="investments-shell">
    <app-page-header
      eyebrow="Investimentos"
      title="Carteira e evolução"
      description="Acompanhe patrimônio, posições, rentabilidade e proventos — gestão e registro, sem recomendação de ativos."
      [hasMeta]="false">
      <div page-actions class="invest-actions">
        <button type="button" class="btn-ghost sm" (click)="openB3ImportModal()">
          <span aria-hidden="true">↓</span> Importar B3
        </button>
        <button type="button" class="btn-primary sm" (click)="showCadastro ? closeCadastroModal() : openCadastroModal()">
          <span aria-hidden="true">{{ showCadastro ? '×' : '+' }}</span> {{ showCadastro ? 'Fechar' : 'Novo lançamento' }}
        </button>
      </div>
    </app-page-header>

    <div class="invest-tabs">
      <app-segmented-selector [options]="investmentTabOptions" [value]="activeTab" ariaLabel="Abas de investimentos" (valueChange)="setTab($event)" />
    </div>

  @if (activeTab === 'RESUMO') {
    <app-investment-overview-panel
      [overview]="overview"
      [(patrimonioRangeMonths)]="patrimonioRangeMonths"
      [(patrimonioTypeFilter)]="patrimonioTypeFilter"
      [(carteiraTypeFilter)]="carteiraTypeFilter"
      [tipos]="tipos"
      [patrimonioAxisTicks]="patrimonioAxisTicks"
      [patrimonioGridColumns]="patrimonioGridColumns"
      [patrimonioSeries]="patrimonioEvolucaoSeries"
      [patrimonioChartMax]="patrimonioChartMax"
      [patrimonioEstimado]="patrimonioEvolucaoEstimado"
      [carteiraDistribuicaoChart]="carteiraDistribuicaoChart" />
  }

  @if (activeTab === 'ANALISE') {
    <app-investment-analysis-panel
      [nextAction]="proximaAcao"
      [distributionItems]="distribuicaoPorTipoComCor"
      [(showConfig)]="showAlocacaoConfig"
      [allocationTypes]="allocationTypes"
      [targetAllocation]="targetAllocation"
      [targetAllocationTotal]="targetAllocationTotal"
      [targetItems]="alvoAlocacao"
      (executeNextAction)="executarProximaAcao()"
      (updateTarget)="updateTargetAllocation($event.type, $event.value)"
      (resetTarget)="resetTargetAllocation()"
      (saveTarget)="saveTargetAllocation()" />
  }

  @if (activeTab === 'RESUMO') {
    <app-investment-assets-list
      [positions]="sortedPositions"
      [pagedPositions]="pagedPositions"
      [totalZeroed]="totalPosicoesZeradas"
      [totalPages]="totalPages"
      [currentPage]="currentPage"
      [pageLabel]="pageLabel"
      [portfolioValue]="patrimonioAtual"
      [tipos]="tipos"
      [accounts]="contasDisponiveis"
      [(searchTerm)]="searchTerm"
      [(filterType)]="filterType"
      [(filterAccount)]="filterAccount"
      [(filterStatus)]="filterStatus"
      [sortBy]="sortBy"
      [sortDir]="sortDir"
      (filtersChanged)="onFiltroMudou()"
      (sort)="ordenarPor($event)"
      (pageChange)="mudarPagina($event)"
      (movement)="abrirMovimento($event)" />
  }

  @if (activeTab === 'CONSOLIDACAO') {
    <app-investment-consolidation-panel
      [series]="consolidacaoSeries"
      [chartMax]="consolidacaoChartMax"
      [rows]="consolidacaoRows"
      [horizonYears]="consolidacaoHorizonteAnos"
      [(typeFilter)]="consolidacaoTipoFiltro"
      [(searchTerm)]="consolidacaoSearchTerm"
      [tipos]="tipos"
      (horizonYearsChange)="consolidacaoHorizonteAnos = $event" />
  }

  @if (activeTab === 'RENTABILIDADE') {
    <app-investment-profitability-panel
      [totalPercent]="rentabilidadeTotalPercent"
      [totalBenchmarkPercent]="rentabilidadeTotalCdiPercent"
      [twelveMonthsPercent]="rentabilidade12mPercent"
      [twelveMonthsBenchmarkPercent]="rentabilidade12mCdiPercent"
      [lastMonthPercent]="rentabilidadeUltimoMesPercent"
      [lastMonthBenchmarkPercent]="rentabilidadeUltimoMesCdiPercent"
      [(period)]="rentabilidadePeriodo"
      [(benchmark)]="rentabilidadeBenchmark"
      [(typeFilter)]="rentabilidadeTipoFiltro"
      [benchmarkOptions]="benchmarkOptions"
      [tipos]="tipos"
      [chartTicks]="rentabilidadeChartTicks"
      [linePortfolio]="rentabilidadeLinhaCarteira"
      [lineBenchmark]="rentabilidadeLinhaCdi"
      [points]="rentabilidadeSeries"
      [benchmarkLabel]="indiceSelecionadoLabel"
      [benchmarkColor]="indiceSelecionadoCor"
      [yearlyRows]="rentabilidadeTabelaAnual" />
  }

  @if (activeTab === 'PROVENTOS') {
    <app-investment-dividends-panel
      [monthlySeries]="proventosMensaisSeries"
      [monthlyMax]="proventosMensaisMax"
      [total12Months]="proventosTotal12Meses"
      [monthlyAverage]="proventosMedia12Meses"
      [payingAssets]="proventosAtivosPagadores"
      [assets]="proventosPorAtivo12Meses" />
  }

  </section>

  <app-investment-launch-modals
    [showCadastro]="showCadastro"
    [cadastroOperacao]="cadastroOperacao"
    [novaPosicao]="novaPosicao"
    [tipos]="tipos"
    [currencyOptions]="currencyOptions"
    [institutions]="institutions"
    [(cadastroCustos)]="cadastroCustos"
    [posicoesVendaveis]="posicoesVendaveis"
    [vendaPositionId]="vendaPositionId"
    [venda]="venda"
    [cadastroValorTotal]="cadastroValorTotal"
    [vendaValorTotal]="vendaValorTotal"
    [showMovimento]="showMovimento"
    [posSelecionada]="posSelecionada"
    [movimento]="movimento"
    [movimentoTipos]="movimentoTipos"
    [(movimentoCustos)]="movimentoCustos"
    [movimentoValorTotal]="movimentoValorTotal"
    (closeCadastro)="closeCadastroModal()"
    (setCadastroOperacao)="setCadastroOperacao($event)"
    (vendaPositionSelected)="onVendaPositionSelected($event)"
    (savePosition)="salvarPosicao()"
    (saveSale)="salvarVenda()"
    (closeMovimento)="closeMovimentoModal()"
    (saveMovement)="salvarMovimento()" />

  <app-investment-import-modal
    [open]="showB3Import"
    [b3Loading]="b3Loading"
    [b3Importing]="b3Importing"
    [b3Error]="b3Error"
    [b3FileName]="b3FileName"
    [b3Preview]="b3Preview"
    [(b3Strategy)]="b3Strategy"
    [csvError]="csvError"
    [csvImported]="csvImported"
    [csvPreviewRows]="csvPreviewRows"
    (close)="closeB3ImportModal()"
    (b3FileSelected)="onB3FileSelected($event)"
    (csvSelected)="onCsvSelected($event)"
    (downloadCsvModel)="baixarModeloCsv()"
    (confirmB3Import)="confirmarImportacaoB3()" />
</section>
