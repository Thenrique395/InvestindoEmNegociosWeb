<div class="signup-card">
  <p class="eyebrow">Cadastro rápido</p>
  <h3>Crie sua conta gratuita</h3>
  <p class="muted">Comece com o módulo de Despesas e Receitas, e evolua para Cartões e Investimentos.</p>

  <form (ngSubmit)="onSubmit()" [formGroup]="form" novalidate>
    <label>
      <span>Nome completo</span>
      <input type="text" formControlName="nome" placeholder="Ex.: Ana Souza" />
      <small class="error" *ngIf="hasError('nome', 'required')">Informe seu nome.</small>
      <small class="error" *ngIf="hasError('nome', 'minlength')">Use ao menos 2 caracteres.</small>
    </label>

    <label>
      <span>E-mail</span>
      <input type="email" formControlName="email" placeholder="voce@email.com" />
      <small class="error" *ngIf="hasError('email', 'required')">Informe um e-mail.</small>
      <small class="error" *ngIf="hasError('email', 'email')">Digite um e-mail válido.</small>
      <small class="error" *ngIf="hasError('email', 'emailInUse')">E-mail já está em uso.</small>
    </label>

    <label>
      <span>Senha</span>
      <input type="password" formControlName="senha" placeholder="Mínimo 6 caracteres" />
      <small class="error" *ngIf="hasError('senha', 'required')">Informe uma senha.</small>
      <small class="error" *ngIf="hasError('senha', 'minlength')">Use ao menos 6 caracteres.</small>
    </label>

    <label class="checkbox">
      <input type="checkbox" formControlName="aceitarTermos" />
      <span>Li e aceito os termos de uso e a política de privacidade.</span>
    </label>
    <small class="error" *ngIf="hasError('aceitarTermos', 'required')">Aceite os termos para continuar.</small>

    <button class="btn-primary" type="submit" [disabled]="loading">
      {{ loading ? 'Criando conta...' : 'Criar conta e entrar' }}
    </button>

    <p class="helper">
      Já possui acesso? Use o botão de login no topo ou a área de “Login”.
    </p>

    <p class="feedback success" *ngIf="feedback">{{ feedback }}</p>
    <p class="feedback error" *ngIf="error">{{ error }}</p>
  </form>
</div>
