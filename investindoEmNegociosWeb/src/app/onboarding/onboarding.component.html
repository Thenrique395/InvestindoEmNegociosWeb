<div class="onboarding">
  <div class="card">
    <p class="eyebrow">Primeiro acesso</p>
    <h2>Complete seus dados</h2>
    <p class="muted">Usamos essas informações para personalizar sua experiência e manter sua conta segura.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>Nome completo</span>
        <input type="text" formControlName="fullName" placeholder="Seu nome completo" />
        <small class="error" *ngIf="hasError('fullName', 'required')">Informe seu nome.</small>
        <small class="error" *ngIf="hasError('fullName', 'minlength')">Mínimo de 3 caracteres.</small>
      </label>

      <label>
        <span>CPF</span>
        <input type="text" formControlName="document" placeholder="000.000.000-00" (input)="onCpfInput($event)" />
        <small class="error" *ngIf="hasError('document', 'required')">Informe o documento.</small>
        <small class="error" *ngIf="hasError('document', 'cpf')">CPF deve ter exatamente 11 dígitos.</small>
      </label>

      <label>
        <span>Telefone</span>
        <input type="tel" formControlName="phone" placeholder="+55 81 999999999" (input)="onPhoneInput($event)" />
        <small class="error" *ngIf="hasError('phone', 'required')">Informe o telefone.</small>
        <small class="error" *ngIf="hasError('phone', 'phone')">Use o formato +55 81 999999999.</small>
      </label>

      <label>
        <span>Data de nascimento</span>
        <input type="date" formControlName="birthDate" />
      </label>

      <div class="actions">
        <button class="primary" type="submit" [disabled]="loading">
          {{ loading ? 'Salvando...' : 'Salvar e continuar' }}
        </button>
      </div>

      <p class="feedback success" *ngIf="feedback">{{ feedback }}</p>
      <p class="feedback error" *ngIf="error">{{ error }}</p>
    </form>
  </div>
</div>
