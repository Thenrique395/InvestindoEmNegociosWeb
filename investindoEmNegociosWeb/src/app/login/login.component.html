<app-auth-layout
  asideEyebrow="Painel financeiro pessoal"
  asideTitle="Controle seu dinheiro com clareza."
  asideText="Uma visão objetiva para acompanhar entradas, saídas, cartões e metas sem perder o contexto do mês."
  proofLabel="Tudo em um só lugar"
  proofText="Receitas, despesas, cartões e metas conectados em um só lugar."
  eyebrow="Login"
  title="Acesse sua conta"
  description="Use seu e-mail e senha para voltar ao dashboard e continuar sua organização financeira.">
  <form class="auth-form" (ngSubmit)="onSubmit()">
    @if (emailNotConfirmed) {
      <div class="auth-alert auth-alert--error" role="alert">
        <svg class="auth-alert__icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v5M12 16.5v.01" />
        </svg>
        <div>
          <p class="auth-alert__title">Confirme seu e-mail para entrar</p>
          <p class="auth-alert__text">
            Verifique sua caixa de entrada.
            <button
              type="button"
              class="auth-field__toggle"
              [disabled]="resending"
              (click)="resendConfirmation()">
              {{ resending ? 'Reenviando…' : 'Reenviar e-mail de confirmação' }}
            </button>
          </p>
        </div>
      </div>
    }

    <div class="auth-field">
      <label class="auth-field__label" for="login-email">E-mail</label>
      <input
        id="login-email"
        class="auth-field__control"
        [(ngModel)]="email"
        name="email"
        type="email"
        placeholder="Digite seu e-mail"
        autocomplete="email"
        required />
    </div>

    <div class="auth-field">
      <label class="auth-field__label" for="login-password">Senha</label>
      <div class="auth-field__wrap">
        <input
          id="login-password"
          class="auth-field__control"
          [(ngModel)]="password"
          name="password"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required />
        <button
          class="auth-field__toggle"
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'">
          {{ showPassword ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>
    </div>

    <div class="auth-options">
      <label class="auth-check auth-check--inline">
        <input
          class="auth-check__input"
          type="checkbox"
          name="manterConectado"
          [(ngModel)]="manterConectado" />
        <span class="auth-check__label">Manter conectado</span>
      </label>
      <a class="auth-link" routerLink="/forgot-password">Esqueci minha senha</a>
    </div>

    <button type="submit" class="auth-submit" [disabled]="loading">
      {{ loading ? 'Autenticando…' : 'Entrar no dashboard' }}
      @if (!loading) {
        <svg class="auth-submit__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      }
    </button>
  </form>

  <p auth-footer class="auth-footer-text">
    Ainda não tem uma conta?
    <a class="auth-link" routerLink="/register">Criar conta agora.</a>
  </p>
</app-auth-layout>
