<section class="overview" aria-label="Visão geral financeira">
  <header class="overview__header">
    <div class="overview__heading">
      <span class="overview__eyebrow">{{ eyebrow() }}</span>
      <h1 class="overview__title">{{ heading() }}</h1>
      @if (!loading()) {
        <p class="overview__description">{{ summary().text }}</p>
      }
    </div>
    <div class="overview__period" role="group" aria-label="Período da visão geral financeira">
      @for (option of periodoOptions; track option.value) {
        <button
          type="button"
          class="overview__period-btn"
          [class.overview__period-btn--active]="periodo() === option.value"
          [attr.aria-pressed]="periodo() === option.value"
          (click)="periodoChange.emit(option.value)">
          {{ option.label }}
        </button>
      }
    </div>
  </header>

  @if (!loading()) {
    <app-kpi-strip class="overview__strip" [items]="kpiItems()" [featureFirst]="true" />

    @if (health(); as saude) {
      <app-health-score-card [health]="saude" />
    }
  } @else {
    <div class="overview__skeleton-strip" aria-hidden="true">
      @for (slot of skeletonSlots; track slot) {
        <div class="overview-skeleton-cell">
          <span class="overview-skeleton overview-skeleton--title"></span>
          <span class="overview-skeleton overview-skeleton--value"></span>
          <span class="overview-skeleton overview-skeleton--note"></span>
          <span class="overview-skeleton overview-skeleton--bar"></span>
        </div>
      }
    </div>
    <p class="sr-only" role="status">Carregando resumo financeiro...</p>
  }
</section>
