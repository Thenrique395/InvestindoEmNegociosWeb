<section class="overview" aria-label="Visão geral financeira">
  <header class="overview__header">
    <div class="overview__heading">
      <h1 class="overview__title">{{ heading() }}</h1>
    </div>
    <div class="overview__period" role="group" aria-label="Período da visão geral financeira">
      @for (option of periodoOptions; track option.value) {
        <button
          type="button"
          class="overview__period-btn"
          [class.overview__period-btn--active]="periodo() === option.value"
          [attr.aria-pressed]="periodo() === option.value"
          (click)="periodoChange.emit(option.value)">
          {{ option.label }}
        </button>
      }
    </div>
  </header>

  @if (!loading()) {
    <p class="overview__summary" [class.overview__summary--analytical]="summary().analytical">
      <span class="overview__summary-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="presentation" focusable="false">
          @if (summary().analytical) {
            <path d="M12 3l1.9 5.3L19 10l-5.1 1.7L12 17l-1.9-5.3L5 10l5.1-1.7L12 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M18.5 15.5l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9.9-2.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
          } @else {
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M9 12.5l2 2 4-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          }
        </svg>
      </span>
      {{ summary().text }}
    </p>

    <ng-template #iconeDoIndicador let-key>
      <svg viewBox="0 0 24 24" role="presentation" focusable="false">
        @switch (key) {
          @case ('saldo') {
            <path d="M12 4v16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            <path d="M16 8.5c0-1.8-1.8-3-4-3s-4 1.2-4 3 1.8 2.5 4 3 4 1.2 4 3-1.8 3-4 3-4-1.2-4-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          }
          @case ('patrimonio') {
            <path d="M5 18h14M7 15l3-4 3 2 4-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M17 7h3v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          }
          @case ('receitas') {
            <path d="M12 19V5m0 0l-5 5m5-5l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          }
          @case ('despesas') {
            <path d="M12 5v14m0 0l-5-5m5 5l5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          }
        }
      </svg>
    </ng-template>

    <app-kpi-strip [items]="kpiItems()" [iconTemplate]="iconeDoIndicador" [featureFirst]="true" />
  } @else {
    <div class="overview__skeleton-strip" aria-hidden="true">
      @for (slot of skeletonSlots; track slot) {
        <div class="overview-skeleton-cell">
          <span class="overview-skeleton overview-skeleton--icon"></span>
          <span class="overview-skeleton overview-skeleton--title"></span>
          <span class="overview-skeleton overview-skeleton--value"></span>
          <span class="overview-skeleton overview-skeleton--note"></span>
        </div>
      }
    </div>
    <p class="sr-only" role="status">Carregando resumo financeiro...</p>
  }
</section>
