@if (sidebarOpen) {
  <div class="sidebar-backdrop fixed inset-0 z-30 bg-[rgba(15,23,42,0.4)] backdrop-blur-[2px]" (click)="closeSidebar()"></div>
}
<aside
  class="sidebar grid min-h-screen content-start gap-[1rem] border-r border-[var(--border)] bg-[var(--sidebar)] p-[calc(var(--space-3)+4px)] max-md:fixed max-md:inset-y-0 max-md:left-0 max-md:z-40 max-md:w-[min(82vw,340px)] max-md:-translate-x-full max-md:transform max-md:transition-transform max-md:shadow-[var(--shadow-md)] max-md:p-[var(--space-2)] max-md:pt-[calc(var(--space-2)+env(safe-area-inset-top))]"
  [ngClass]="sidebarOpen ? 'max-md:translate-x-0' : ''"
  >
  <div class="sidebar__brand flex items-center gap-3 border-b border-[var(--border)] px-[var(--space-1)] pb-[var(--space-2)]">
    <img
      class="sidebar__logo block h-[40px] w-auto max-md:h-[32px]"
      [src]="isLightTheme ? '/assets/logoHeaderInvestindoemNegocios2.png' : '/assets/logoHeaderInvestindoemNegocios.png'"
      [alt]="brandName"
      width="34"
      height="34"
      loading="eager"
      decoding="async" />
    <span class="sidebar__title text-[var(--text-lg)] font-bold tracking-[0.02em] text-[var(--text)] max-md:text-[var(--text-md)]">{{ brandName }}</span>
  </div>
  <div class="sidebar__label px-[var(--space-1)] pt-[var(--space-1)] text-[var(--text-xs)] tracking-[0.12em] text-[var(--text-muted)] max-md:px-0 max-md:pt-0">Menu</div>
  <nav class="sidebar__nav grid gap-1 px-[var(--space-1)] pt-[var(--space-1)] max-md:px-0" (click)="closeSidebar()">
    @for (item of navItems; track item.path) {
      @if (canShowItem(item)) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          #routeActive="routerLinkActive"
          (click)="reloadIfSame(item.path, $event)"
          [ngClass]="itemLinkClass(item, routeActive.isActive)"
          >
          <span [ngClass]="itemIconClass(item, routeActive.isActive)" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="presentation" focusable="false">
              @switch (item.icon) {
                @case ('dashboard') {
                  <path d="M3 10.5L12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('expense') {
                  <path d="M12 5v14m0 0l-5-5m5 5l5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('income') {
                  <path d="M12 19V5m0 0l-5 5m5-5l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('calendar') {
                  <path d="M7 2v3M17 2v3M4 7h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('card') {
                  <path d="M3 7h18a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zm0 3h20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('account') {
                  <path d="M3 9l9-6 9 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9zM9 21v-7h6v7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('category') {
                  <path d="M4 6a2 2 0 0 1 2-2h4v4a2 2 0 1 0 4 0V4h4a2 2 0 0 1 2 2v4h-4a2 2 0 1 0 0 4h4v4a2 2 0 0 1-2 2h-4v-4a2 2 0 1 0-4 0v4H6a2 2 0 0 1-2-2v-4h4a2 2 0 1 0 0-4H4V6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('investment') {
                  <path d="M4 18h16M7 15l4-4 3 3 4-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('goal') {
                  <path d="M12 3a9 9 0 1 0 9 9m-9-6a6 6 0 1 0 6 6m-6-3a3 3 0 1 0 3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M21 3l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('loan') {
                  <path d="M5 7h14M7 12h10M9 17h6M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('snapshot') {
                  <path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('assistant') {
                  <path d="M12 4c4.4 0 8 2.9 8 6.5S16.4 17 12 17c-.7 0-1.5-.1-2.2-.3L5 19l1.1-3.3C4.8 14.6 4 12.7 4 10.5 4 6.9 7.6 4 12 4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('calculator') {
                  <path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M8 8h8M8 12h3M13 12h3M8 16h3M13 16h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('admin') {
                  <path d="M12 3l7 3v6c0 4.4-3 7.9-7 9-4-1.1-7-4.6-7-9V6l7-3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M12 7v6l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('parameters') {
                  <path d="M4 7h16M4 17h16M7 7v10M17 7v10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                }
                @case ('robot') {
                  <path d="M12 3v4M12 17v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M3 12h4M17 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                  <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7" />
                }
              }
            </svg>
          </span>
          <span [ngClass]="itemTextClass(item)">{{ item.label }}</span>
        </a>
      }
    }
  </nav>
  <div class="sidebar__footer mt-auto border-t border-[var(--border)] px-[var(--space-1)] pt-[var(--space-2)] max-md:mt-0 max-md:px-0 max-md:pt-[var(--space-1)]">
    <button
      type="button"
      class="sidebar__settings group flex min-h-[48px] items-center gap-3 rounded-[14px] border border-transparent px-[var(--space-2)] py-[var(--space-1)] text-[var(--text-secondary)] transition hover:border-[var(--border-strong)] hover:bg-[var(--surface-2)] max-md:min-h-[44px]"
      (click)="goToPreferences($event)"
      >
      <span class="nav-icon grid h-10 w-10 place-items-center rounded-[14px] border border-[var(--border)] bg-[var(--surface-2)] text-[var(--text-secondary)] transition max-md:h-[34px] max-md:w-[34px] max-md:rounded-[10px]" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="presentation" focusable="false">
          <path d="M12 8.5a3.5 3.5 0 1 0 3.5 3.5A3.5 3.5 0 0 0 12 8.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M19.4 15a7.9 7.9 0 0 0 .1-2l2-1.2-2-3.5-2.2.6a7.7 7.7 0 0 0-1.7-1l-.3-2.3H9.7l-.3 2.3a7.7 7.7 0 0 0-1.7 1l-2.2-.6-2 3.5 2 1.2a7.9 7.9 0 0 0 .1 2l-2 1.2 2 3.5 2.2-.6a7.7 7.7 0 0 0 1.7 1l.3 2.3h4.6l.3-2.3a7.7 7.7 0 0 0 1.7-1l2.2.6 2-3.5-2-1.2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <span class="nav-text text-[var(--text-sm)] font-semibold max-md:text-[var(--text-xs)]">Configurações</span>
    </button>
  </div>
</aside>
