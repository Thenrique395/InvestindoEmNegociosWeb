<section class="rendas">
  <div class="nav-row">
    <div>
      <p class="eyebrow">Rendas</p>
      <h2>Suas fontes de renda</h2>
      <p class="muted">Cadastre salários, PLR, freelas e demais recebimentos.</p>
      <div class="nav">
        <button type="button" (click)="mesAnterior()">◀ Mês anterior</button>
        <button type="button" (click)="proximoMes()">Próximo mês ▶</button>
      </div>
    </div>
    <div class="total">
      <span>Total {{ mesAtualLabel }}</span>
      <strong>R$ {{ totalRendas | number:'1.2-2' }}</strong>
      <div class="total__actions">
        <button type="button" class="btn-primary" (click)="abrirModal()">Adicionar renda</button>
      </div>
    </div>
  </div>

  <app-rendas-lista [rendas]="rendas" (editar)="editarPorId($event)" (remover)="remover($event)"></app-rendas-lista>

  <app-rendas-form
    [mostrarForm]="mostrarForm"
    [novaRenda]="novaRenda"
    [valorInput]="valorInput"
    [recebimentoInput]="recebimentoInput"
    [fixaInicioInput]="fixaInicioInput"
    [fixaFimInput]="fixaFimInput"
    [erroData]="erroData"
    [valorSugestao]="valorSugestao"
    [editandoId]="editandoId"
    [resumoTexto]="resumoTexto"
    (valorChange)="onValorChange($event)"
    (recebimentoChange)="onRecebimentoChange($event)"
    (fonteChange)="onFonteChange($event)"
    (fixaChange)="novaRenda.fixa = $event"
    (fixaInicioChange)="onFixaInicioChange($event)"
    (fixaFimChange)="onFixaFimChange($event)"
    (aplicarSugestao)="aplicarSugestao()"
    (salvarForm)="salvar()"
    (fechar)="fecharModal()" />
</section>
