<section class="rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-4">
  <h2>{{ editingId ? 'Editar conta' : 'Nova conta' }}</h2>

  <div class="grid gap-3 md:grid-cols-4">

    <app-form-field label="Nome da conta" [error]="nameError">
      <input type="text" [(ngModel)]="form.name" (blur)="onTouch('name')" />
    </app-form-field>

    <app-form-field label="Tipo" [error]="typeError">
      <select [(ngModel)]="form.type" (blur)="onTouch('type')">
        <option *ngFor="let t of accountTypes" [value]="t">{{ t }}</option>
      </select>
    </app-form-field>

    <app-form-field label="Saldo inicial" [error]="balanceError">
      <input type="number" [(ngModel)]="form.initialBalance" (blur)="onTouch('initialBalance')" />
    </app-form-field>

    <label>
      <input type="checkbox" [(ngModel)]="form.isActive" /> Conta ativa
    </label>

  </div>

  <div>
    <button (click)="onSave()">Salvar</button>
    <button (click)="onClear()">Limpar</button>
  </div>
</section>
