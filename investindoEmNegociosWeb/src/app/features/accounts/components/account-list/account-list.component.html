<section class="account-list">
  @if (showHeader) {
    <div class="account-list__head">
      <div>
        <p class="account-list__eyebrow">Carteira de contas</p>
        <h2>Minhas contas</h2>
      </div>
      <button type="button" class="account-list__refresh" (click)="refresh.emit()">Atualizar</button>
    </div>
  }

  @if (loading) {
    <app-ui-state type="loading" title="Carregando contas..."></app-ui-state>
  }

  @if (!loading && !hasAccounts) {
    @if (canManage) {
      <app-empty-state
        title="Nenhuma conta cadastrada"
        description="Crie sua primeira conta"
        ctaLabel="Criar conta"
        (action)="create.emit()">
      </app-empty-state>
    } @else {
      <app-empty-state
        title="Nenhuma conta cadastrada"
        description="Nenhuma conta foi cadastrada ainda.">
      </app-empty-state>
    }
  }

  @if (!loading && hasAccounts) {
    <div class="account-list__grid">
      @for (account of accounts; track trackByAccountId($index, account)) {
        <app-account-card
          [account]="account"
          [activity]="activityFor(account.id)"
          [isPrimary]="account.id === primaryAccountId"
          [canManage]="canManage"
          [canTransfer]="canTransfer"
          [canSetPrimary]="canSetPrimary"
          (viewStatement)="selectAccount.emit($event.id)"
          (edit)="edit.emit($event)"
          (remove)="remove.emit($event)"
          (transfer)="transfer.emit($event)"
          (setPrimary)="setPrimary.emit($event)">
        </app-account-card>
      }
    </div>
  }
</section>
