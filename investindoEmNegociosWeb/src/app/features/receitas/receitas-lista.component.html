<app-responsive-list
  [columns]="columns"
  [items]="rendas"
  [getId]="getId"
  [sortBy]="sortBy"
  [sortDir]="sortDir"
  [loading]="loading"
  loadingLabel="Carregando receitas do mês..."
  [emptyTitle]="emptyTitle"
  [emptyDescription]="emptyDescription"
  [emptyCtaLabel]="emptyCtaLabel"
  emptyIcon="💰"
  [pageSize]="8"
  [pageSizeOptions]="[8, 16, 32]"
  itemsLabel="lançamentos"
  [selectable]="true"
  [selectedIds]="selectedIds"
  [selectableIds]="selectableIds"
  (sort)="onSort($event)"
  (selectionChange)="onSelectionChange($event)"
  (selectAllChange)="onSelectAllChange($event)"
  (emptyAction)="emptyAction.emit()">

  <ng-template appResponsiveListCell="fonte" let-r>
    <span class="receitas-lista__name">{{ r.fonte }}</span>
    @if (subtitulo(r); as sub) {
      <small class="receitas-lista__subtitle">{{ sub }}</small>
    }
  </ng-template>

  <ng-template appResponsiveListCell="categoria" let-r>
    <span class="receitas-lista__muted">{{ r.categoria || 'Sem categoria' }}</span>
  </ng-template>

  <ng-template appResponsiveListCell="valor" let-r>
    <span class="receitas-lista__amount">{{ r.valor | appCurrency }}</span>
  </ng-template>

  <ng-template appResponsiveListCell="recebimento" let-r>
    <span class="receitas-lista__muted">{{ dataCurta(r.recebimento) }}</span>
  </ng-template>

  <ng-template appResponsiveListCell="tipo" let-r>
    <span class="receitas-lista__muted">{{ r.fixa ? 'Recorrente' : 'Avulsa' }}</span>
  </ng-template>

  <ng-template appResponsiveListCell="status" let-r>
    <app-status-badge [tone]="statusTone(r)" [icon]="statusIcon(r)" [label]="statusLabel(r)"></app-status-badge>
  </ng-template>

  <ng-template appResponsiveListCell="acoes" let-r>
    <div class="receitas-lista__actions">
      <button
        type="button"
        class="receitas-lista__icon-action"
        (click)="historico.emit(r.id!)"
        aria-label="Histórico"
        title="Histórico">
        <svg viewBox="0 0 24 24" role="presentation" focusable="false">
          <path d="M12 8v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M3.5 12a8.5 8.5 0 1 0 2.2-5.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M3 4v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button
        type="button"
        class="receitas-lista__icon-action receitas-lista__icon-action--edit"
        (click)="onEditar(r.id!)"
        aria-label="Editar"
        title="Editar">
        <svg viewBox="0 0 24 24" role="presentation" focusable="false">
          <path d="M4 20h4l10-10-4-4L4 16v4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="m12 6 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button
        type="button"
        class="receitas-lista__icon-action receitas-lista__icon-action--danger"
        (click)="onRemover(r.planId, r.id)"
        aria-label="Excluir"
        title="Excluir">
        <svg viewBox="0 0 24 24" role="presentation" focusable="false">
          <path d="M4 7h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <path d="M9 7V5h6v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
      @if (canAttachReceipt(r)) {
        <button
          type="button"
          class="receitas-lista__icon-action"
          [disabled]="isAttachingReceipt(r.id)"
          (click)="onComprovante(r.id)"
          aria-label="Anexar comprovante"
          title="Comprovante">
          <svg viewBox="0 0 24 24" role="presentation" focusable="false">
            <path d="M8 12.5V7a4 4 0 0 1 8 0v8a3 3 0 0 1-6 0V9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      }
    </div>
  </ng-template>
</app-responsive-list>
