<app-responsive-list
  [columns]="columns"
  [items]="despesas"
  [getId]="getId"
  [sortBy]="sortBy"
  [sortDir]="sortDir"
  [emptyTitle]="emptyTitle"
  [emptyDescription]="emptyDescription"
  [emptyCtaLabel]="emptyCtaLabel"
  emptyIcon="🧾"
  [pageSize]="8"
  [pageSizeOptions]="[8, 16, 32]"
  itemsLabel="lançamentos"
  [selectable]="true"
  [selectedIds]="selectedIds"
  [selectableIds]="selectableIds"
  (sort)="onSort($event)"
  (selectionChange)="onSelectionChange($event)"
  (selectAllChange)="onSelectAllChange($event)"
  (emptyAction)="emptyAction.emit()">

  <ng-template appResponsiveListCell="nome" let-d>
    <span class="despesas-lista__name">{{ d.nome }}</span>
    @if (subtitulo(d); as sub) {
      <small class="despesas-lista__subtitle">{{ sub }}</small>
    }
  </ng-template>

  <ng-template appResponsiveListCell="categoria" let-d>
    <span class="despesas-lista__muted">{{ d.categoria || 'Sem categoria' }}</span>
  </ng-template>

  <ng-template appResponsiveListCell="pagamento" let-d>
    <span class="despesas-lista__muted">{{ pagamentoLabel(d) }}</span>
  </ng-template>

  <ng-template appResponsiveListCell="status" let-d>
    <app-status-badge [tone]="statusTone(d)" [icon]="statusIcon(d)" [label]="statusLabel(d)"></app-status-badge>
  </ng-template>

  <ng-template appResponsiveListCell="vencimento" let-d>
    <span class="despesas-lista__muted">{{ dataCurta(d.vencimento) }}</span>
  </ng-template>

  <ng-template appResponsiveListCell="valor" let-d>
    <span class="despesas-lista__amount">{{ d.valor | appCurrency }}</span>
    @if (d.parcelasTotal) {
      <small class="despesas-lista__recurrence">{{ d.parcelaNumero }}/{{ d.parcelasTotal }}</small>
    }
  </ng-template>

  <ng-template appResponsiveListCell="acoes" let-d>
    <div class="despesas-lista__actions">
      <button
        type="button"
        class="despesas-lista__icon-action"
        (click)="historico.emit(d.id!)"
        aria-label="Histórico"
        title="Histórico">
        <svg viewBox="0 0 24 24" role="presentation" focusable="false">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M12 10v6M12 7h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button
        type="button"
        class="despesas-lista__icon-action despesas-lista__icon-action--edit"
        (click)="editar.emit(d.id!)"
        aria-label="Editar"
        title="Editar">
        <svg viewBox="0 0 24 24" role="presentation" focusable="false">
          <path d="M4 20h4l10-10-4-4L4 16v4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="m12 6 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button
        type="button"
        class="despesas-lista__icon-action despesas-lista__icon-action--danger"
        (click)="remover.emit(d.id!)"
        aria-label="Excluir"
        title="Excluir">
        <svg viewBox="0 0 24 24" role="presentation" focusable="false">
          <path d="M4 7h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <path d="M9 7V5h6v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </ng-template>
</app-responsive-list>
