<section class="admin-categories">
  <header class="admin-categories__header">
    <div>
      <h1>Categorias padrão</h1>
      <p>Gerencie categorias globais para todos os usuários.</p>
    </div>
    <div class="actions">
      <label class="toggle">
        <input type="checkbox" [checked]="includeInactive" (change)="toggleIncludeInactive()" />
        <span>Exibir inativas</span>
      </label>
      <button type="button" class="btn-primary" (click)="openCreate()">Nova categoria</button>
    </div>
  </header>

  <div class="status" *ngIf="loading">Carregando categorias...</div>
  <div class="status error" *ngIf="error">{{ error }}</div>

  <div class="list" *ngIf="!loading && categories.length">
    <div class="list__item" *ngFor="let cat of categories">
      <div class="info">
        <strong>{{ cat.name }}</strong>
        <span class="muted">{{ cat.appliesTo || 'Todos' }}</span>
        <span class="tag" [class.off]="!cat.isActive">{{ cat.isActive ? 'Ativa' : 'Inativa' }}</span>
      </div>
      <div class="item-actions">
        <button type="button" class="ghost" (click)="openEdit(cat)">Editar</button>
        <button type="button" class="ghost" (click)="toggleStatus(cat)">
          {{ cat.isActive ? 'Desativar' : 'Ativar' }}
        </button>
      </div>
    </div>
  </div>

  <div class="status empty" *ngIf="!loading && !categories.length">Nenhuma categoria cadastrada.</div>

  <div class="modal" *ngIf="showModal">
    <div class="modal__backdrop" (click)="closeModal()"></div>
    <div class="modal__card">
      <h2>{{ editing ? 'Editar categoria' : 'Nova categoria' }}</h2>
      <label>
        Nome
        <input type="text" [(ngModel)]="name" />
      </label>
      <label>
        Aplica em
        <select [(ngModel)]="appliesTo">
          <option value="">Todos</option>
          <option value="Income">Receitas</option>
          <option value="Expense">Despesas</option>
        </select>
      </label>
      <div class="modal__actions">
        <button type="button" class="btn-cancel" (click)="closeModal()">Cancelar</button>
        <button type="button" class="btn-primary" (click)="save()" [disabled]="saving">
          {{ saving ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </div>
  </div>
</section>
