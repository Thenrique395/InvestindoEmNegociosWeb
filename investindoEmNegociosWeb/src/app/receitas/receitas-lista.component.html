<div class="lista" [class.lista--status]="showStatus">
  <div class="lista__head">
    <label class="checkbox">
      <input
        type="checkbox"
        [checked]="rendas.length && selectedIds.length === rendas.length"
        [indeterminate]="selectedIds.length > 0 && selectedIds.length < rendas.length"
        (change)="selecionarTodos.emit($any($event.target)?.checked ?? false)"
        aria-label="Selecionar todas" />
    </label>
    <span class="col-fonte">Fonte</span>
    <span class="col-categoria">Categoria</span>
    <span class="col-valor">Valor</span>
    <span class="col-recebimento">Recebimento</span>
    <span class="col-tipo">Tipo</span>
    <span *ngIf="showStatus" class="col-status">Status</span>
    <span class="col-acoes acoes-head">Ações</span>
  </div>
  <div class="lista__row lista__row--empty" *ngIf="!rendas.length">
    <span class="muted">Sem receitas no mês. Clique em “Adicionar receita” para começar.</span>
  </div>
  <div class="lista__row" *ngFor="let r of rendas">
    <label class="checkbox">
      <input
        type="checkbox"
        [checked]="isSelecionado(r.id)"
        [disabled]="r.status === 'PAID' || r.status === 'CANCELED'"
        (change)="selecionar.emit({ id: r.id!, checked: $any($event.target)?.checked ?? false })"
        aria-label="Selecionar receita" />
    </label>
    <span class="col-fonte" data-label="Fonte">{{ r.fonte }}</span>
    <span class="col-categoria" data-label="Categoria">{{ r.categoria || 'Sem categoria' }}</span>
    <span class="col-valor" data-label="Valor">R$ {{ r.valor | number:'1.2-2' }}</span>
    <span class="col-recebimento" data-label="Recebimento">{{ r.recebimento || '—' }}</span>
    <span class="col-tipo" data-label="Tipo">{{ r.fixa ? 'Recorrente' : 'Avulsa' }}</span>
    <span *ngIf="showStatus" class="col-status status" data-label="Status" [class.paid]="statusLabel(r) === 'Recebido'">
      {{ statusLabel(r) }}
    </span>
    <span class="col-acoes acoes" data-label="Ações">
      <button type="button" class="icon-action icon-action--edit" (click)="onEditar(r.id!)" aria-label="Editar" title="Editar">✏️</button>
      <button type="button" class="icon-action icon-action--danger" (click)="onRemover(r.planId, r.id)" aria-label="Excluir" title="Excluir">🗑</button>
    </span>
  </div>
</div>
