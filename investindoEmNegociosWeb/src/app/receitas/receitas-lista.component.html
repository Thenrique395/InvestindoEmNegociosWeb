<div class="rounded-2xl border border-[var(--border)] bg-[var(--surface)] shadow-[var(--shadow-md)]" [class.opacity-60]="!rendas.length">
  <div class="overflow-x-auto">
    <table class="min-w-full text-sm">
      <thead class="bg-[var(--surface-2)] text-left text-[var(--text)]">
        <tr class="border-b border-[var(--border)]">
          <th class="px-5 py-4">
            <input
              class="h-4 w-4 accent-[var(--primary)]"
              type="checkbox"
              [checked]="rendas.length && selectedIds.length === rendas.length"
              [indeterminate]="selectedIds.length > 0 && selectedIds.length < rendas.length"
              (change)="selecionarTodos.emit($any($event.target)?.checked ?? false)"
              aria-label="Selecionar todas" />
          </th>
          <th class="px-5 py-4 font-semibold">
            <button
              type="button"
              class="inline-flex items-center gap-1 text-[var(--text)] hover:text-[var(--text)]"
              (click)="ordenarPor('fonte')">
              Fonte
              <span class="text-[10px] text-[var(--text-muted)]" *ngIf="sortBy === 'fonte'">
                {{ sortDir === 1 ? '↑' : '↓' }}
              </span>
            </button>
          </th>
          <th class="px-5 py-4 font-semibold">
            <button
              type="button"
              class="inline-flex items-center gap-1 text-[var(--text)] hover:text-[var(--text)]"
              (click)="ordenarPor('categoria')">
              Categoria
              <span class="text-[10px] text-[var(--text-muted)]" *ngIf="sortBy === 'categoria'">
                {{ sortDir === 1 ? '↑' : '↓' }}
              </span>
            </button>
          </th>
          <th class="px-5 py-4 font-semibold text-center">
            <button
              type="button"
              class="inline-flex items-center gap-1 text-[var(--text)] hover:text-[var(--text)]"
              (click)="ordenarPor('valor')">
              Valor
              <span class="text-[10px] text-[var(--text-muted)]" *ngIf="sortBy === 'valor'">
                {{ sortDir === 1 ? '↑' : '↓' }}
              </span>
            </button>
          </th>
          <th class="px-5 py-4 font-semibold">
            <button
              type="button"
              class="inline-flex items-center gap-1 text-[var(--text)] hover:text-[var(--text)]"
              (click)="ordenarPor('recebimento')">
              Recebimento
              <span class="text-[10px] text-[var(--text-muted)]" *ngIf="sortBy === 'recebimento'">
                {{ sortDir === 1 ? '↑' : '↓' }}
              </span>
            </button>
          </th>
          <th class="px-5 py-4 font-semibold">
            <button
              type="button"
              class="inline-flex items-center gap-1 text-[var(--text)] hover:text-[var(--text)]"
              (click)="ordenarPor('tipo')">
              Tipo
              <span class="text-[10px] text-[var(--text-muted)]" *ngIf="sortBy === 'tipo'">
                {{ sortDir === 1 ? '↑' : '↓' }}
              </span>
            </button>
          </th>
          <th *ngIf="showStatus" class="px-5 py-4 font-semibold">
            <button
              type="button"
              class="inline-flex items-center gap-1 text-[var(--text)] hover:text-[var(--text)]"
              (click)="ordenarPor('status')">
              Status
              <span class="text-[10px] text-[var(--text-muted)]" *ngIf="sortBy === 'status'">
                {{ sortDir === 1 ? '↑' : '↓' }}
              </span>
            </button>
          </th>
          <th class="px-5 py-4 text-center font-semibold">Ações</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-[var(--border)]">
        <tr *ngIf="!rendas.length">
          <td class="px-5 py-6 text-sm text-[var(--text-muted)]" [attr.colspan]="showStatus ? 8 : 7">
            Sem receitas no mês. Clique em “Adicionar receita” para começar.
          </td>
        </tr>
        <tr *ngFor="let r of rendas" class="hover:bg-[var(--surface-2)]">
          <td class="px-5 py-4 align-middle">
            <input
              class="h-4 w-4 accent-[var(--primary)]"
              type="checkbox"
              [checked]="isSelecionado(r.id)"
              [disabled]="r.status === 'PAID' || r.status === 'CANCELED'"
              (change)="selecionar.emit({ id: r.id!, checked: $any($event.target)?.checked ?? false })"
              aria-label="Selecionar receita" />
          </td>
          <td class="px-5 py-4 font-medium text-[var(--text)]">{{ r.fonte }}</td>
          <td class="px-5 py-4 text-[var(--text-muted)]">{{ r.categoria || 'Sem categoria' }}</td>
          <td class="px-5 py-4 text-right font-semibold">R$ {{ r.valor | number:'1.2-2' }}</td>
          <td class="px-5 py-4 text-[var(--text-muted)]">{{ r.recebimento || '—' }}</td>
          <td class="px-5 py-4 text-[var(--text-muted)]">{{ r.fixa ? 'Recorrente' : 'Avulsa' }}</td>
          <td *ngIf="showStatus" class="px-5 py-4">
            <span
              class="inline-flex items-center gap-2 rounded-full px-2.5 py-1 text-xs font-semibold"
              [ngClass]="statusLabel(r) === 'Recebido' ? 'border border-emerald-200 bg-emerald-100 text-emerald-700' : 'border border-amber-200 bg-amber-100 text-amber-700'">
              <span class="inline-flex h-2 w-2 rounded-full bg-current/70"></span>
              {{ statusLabel(r) }}
            </span>
          </td>
          <td class="px-5 py-4">
            <div class="flex items-center justify-end gap-2">
              <button type="button" class="icon-action icon-action--edit" (click)="onEditar(r.id!)" aria-label="Editar" title="Editar">✏️</button>
              <button type="button" class="icon-action icon-action--danger" (click)="onRemover(r.planId, r.id)" aria-label="Excluir" title="Excluir">🗑</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
