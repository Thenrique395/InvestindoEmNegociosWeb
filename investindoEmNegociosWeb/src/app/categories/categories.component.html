<section class="cat-page">
  <app-page-header
    eyebrow="Central de categorias"
    title="Categorias"
    [description]="isAdmin
      ? 'Gerencie as categorias do sistema e as suas próprias para organizar receitas e despesas.'
      : 'Organize receitas e despesas para entender melhor sua vida financeira.'"
    [hasMeta]="false">
    <div page-actions class="cat-actions">
      <button type="button" class="btn-primary sm" (click)="abrirModal()">
        <span aria-hidden="true">+</span> Nova categoria
      </button>
    </div>
  </app-page-header>

  <!-- Cards de resumo -->
  <section class="cat-summary" aria-label="Resumo de categorias">
    <app-transaction-summary-card tone="primary" eyebrow="Total de categorias" [value]="overview().total.toString()" [note]="overview().activeCount + ' ativa(s)'"
      tooltipText="Todas as categorias visíveis para você: as padrão do sistema mais as que você criou. O número ao lado conta só as ativas.">
      <svg stat-icon viewBox="0 0 24 24" role="presentation" focusable="false">
        <path d="M4 7h7v7H4zM13 4h7v7h-7zM13 14h7v6h-7zM4 16h7v4H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
      </svg>
    </app-transaction-summary-card>

    <app-transaction-summary-card tone="danger" eyebrow="Categorias de despesas" [value]="overview().expenseCount.toString()" note="Classifique suas saídas."
      tooltipText="Categorias disponíveis para classificar despesas. São elas que alimentam o orçamento e a distribuição por categoria do dashboard.">
      <svg stat-icon viewBox="0 0 24 24" role="presentation" focusable="false">
        <path d="M12 19V5M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </app-transaction-summary-card>

    <app-transaction-summary-card tone="success" eyebrow="Categorias de receitas" [value]="overview().incomeCount.toString()" note="Classifique suas entradas."
      tooltipText="Categorias disponíveis para classificar receitas. Uma categoria serve a despesa ou a receita, nunca às duas.">
      <svg stat-icon viewBox="0 0 24 24" role="presentation" focusable="false">
        <path d="M12 5v14M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </app-transaction-summary-card>

    <app-transaction-summary-card tone="info" [eyebrow]="isAdmin ? 'Minhas categorias' : 'Personalizadas'" [value]="overview().customCount.toString()" note="Criadas por você."
      tooltipText="Categorias que você criou, fora as padrão do sistema. Só estas podem ser renomeadas ou excluídas.">
      <svg stat-icon viewBox="0 0 24 24" role="presentation" focusable="false">
        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </app-transaction-summary-card>
  </section>

  <!-- Abas de tipo -->
  <div class="cat-controls">
    <app-segmented-selector [options]="tabOptions" [value]="filters.tab" ariaLabel="Filtrar por tipo" (valueChange)="setTab($event)" />
  </div>

  <!-- Filtros -->
  <div class="cat-filterbar">
    <div class="cat-filters">
      <label class="cat-filter cat-filter--grow">
        <span class="cat-filter__label">Buscar</span>
        <input type="search" [(ngModel)]="filters.search" (ngModelChange)="onFilterChange()" placeholder="Nome da categoria" aria-label="Buscar categoria" />
      </label>
      <label class="cat-filter">
        <span class="cat-filter__label">Origem</span>
        <app-select-menu
          [options]="originFilterOptions"
          [(ngModel)]="filters.origin"
          (valueChange)="onFilterChange()"
          ariaLabel="Filtrar por origem" />
      </label>
      <label class="cat-filter">
        <span class="cat-filter__label">Status</span>
        <app-select-menu
          [options]="statusFilterOptions"
          [(ngModel)]="filters.status"
          (valueChange)="onFilterChange()"
          ariaLabel="Filtrar por status" />
      </label>
    </div>
  </div>

  <!-- Lista -->
  @if (busy) {
    <div class="cat-hint">Carregando categorias...</div>
  } @else if (!overview().total) {
    <app-empty-state
      icon="🗂️"
      title="Você ainda não possui categorias cadastradas."
      description="Crie categorias para organizar melhor suas receitas e despesas."
      ctaLabel="Criar categoria"
      (action)="abrirModal()">
    </app-empty-state>
  } @else {
    <section class="cat-list-card">
      <app-category-list
        [views]="filteredViews"
        [isAdmin]="isAdmin"
        (edit)="onEditView($event)"
        (toggleStatus)="onToggleView($event)"
        (remove)="remover($event)">
      </app-category-list>

      @if (!filteredViews.length) {
        <app-empty-state title="Nenhuma categoria encontrada" description="Ajuste a busca ou os filtros."></app-empty-state>
      }
    </section>
  }

  <!-- Modal criar categoria -->
  <app-modal [open]="showModal()" eyebrow="Cadastro" title="Nova categoria" size="sm" (close)="fecharModal()">
    <div class="cat-form" modal-body>
      <app-form-field label="Nome da categoria" [error]="categoryForm.error('name')" [submitted]="categoryForm.submitted" [animate]="categoryForm.shouldAnimate('name')">
        <input type="text" placeholder="Ex.: Moradia" [(ngModel)]="nome" (blur)="categoryForm.markTouched('name')" />
      </app-form-field>
      <app-form-field label="Tipo" [error]="categoryForm.error('type')" [submitted]="categoryForm.submitted" [animate]="categoryForm.shouldAnimate('type')">
        <select [(ngModel)]="tipo" (blur)="categoryForm.markTouched('type')">
          @for (t of tipos; track t.id) {
            <option [value]="t.id">{{ t.label }}</option>
          }
        </select>
      </app-form-field>
      @if (isAdmin) {
        <app-form-field label="Escopo" [error]="categoryForm.error('scope')" [submitted]="categoryForm.submitted" [animate]="categoryForm.shouldAnimate('scope')">
          <select [(ngModel)]="escopo" (blur)="categoryForm.markTouched('scope')">
            <option value="user">Minha (pessoal)</option>
            <option value="default">Sistema (todos os usuários)</option>
          </select>
        </app-form-field>
      }
    </div>
    <div modal-footer>
      <button type="button" class="btn-ghost sm" (click)="fecharModal()">Cancelar</button>
      <button type="button" class="btn-primary sm" (click)="adicionar()" [disabled]="saving()">{{ saving() ? 'Salvando...' : 'Criar categoria' }}</button>
    </div>
  </app-modal>

  <!-- Modal editar categoria de sistema (admin) -->
  <app-modal [open]="showAdminModal()" eyebrow="Sistema" title="Editar categoria de sistema" size="sm" (close)="closeAdminModal()">
    <div class="cat-form" modal-body>
      <app-form-field label="Nome"><input type="text" [(ngModel)]="adminName" /></app-form-field>
      <app-form-field label="Aplica em">
        <select [(ngModel)]="adminAppliesTo">
          <option value="">Todos</option>
          <option value="Income">Receitas</option>
          <option value="Expense">Despesas</option>
        </select>
      </app-form-field>
    </div>
    <div modal-footer>
      <button type="button" class="btn-ghost sm" (click)="closeAdminModal()">Cancelar</button>
      <button type="button" class="btn-primary sm" (click)="saveAdmin()" [disabled]="adminSaving()">{{ adminSaving() ? 'Salvando...' : 'Salvar' }}</button>
    </div>
  </app-modal>

  <!-- Confirmação de exclusão -->
  @if (deleteTarget) {
    <app-confirm-dialog
      title="Remover categoria?"
      [message]="'Remover a categoria \'' + deleteTarget.category.name + '\'? Lançamentos associados deixam de referenciar esta categoria.'"
      confirmLabel="Remover categoria"
      cancelLabel="Cancelar"
      variant="danger"
      (confirmed)="confirmarRemocao()"
      (cancelled)="cancelarRemocao()">
    </app-confirm-dialog>
  }
</section>
