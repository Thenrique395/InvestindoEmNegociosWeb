<section class="categories-page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Gerenciar categorias</p>
      <h1>Organize receitas e despesas</h1>
      <p class="muted">Categorias padrão são compartilhadas; crie as suas e use as do sistema quando quiser.</p>
    </div>
  </header>

  <app-filter-bar>
    <div filter-left>
      <input type="text" placeholder="Buscar categoria..." [(ngModel)]="buscaNome" />

      <select [(ngModel)]="filtroTipo" (change)="carregar()">
        <option value="">Todos</option>
        <option *ngFor="let t of tipos; trackBy: trackByIndex" [value]="t.id">
          {{ t.label }}
        </option>
      </select>
    </div>

    <div filter-right>
      <button class="btn-primary" (click)="abrirModal()">Nova categoria</button>
    </div>
  </app-filter-bar>
</section>
