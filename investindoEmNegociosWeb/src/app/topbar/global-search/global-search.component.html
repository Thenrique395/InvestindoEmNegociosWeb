<form class="global-search" role="search" (submit)="$event.preventDefault()">
  <svg class="global-search__icon" viewBox="0 0 24 24" role="presentation" focusable="false" aria-hidden="true">
    <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.7" />
    <path d="M16.2 16.2L21 21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
  </svg>
  <input
    #searchInput
    class="global-search__input"
    type="search"
    placeholder="Buscar transações, contas, cartões..."
    aria-label="Busca global"
    autocomplete="off"
    (keydown.escape)="blurSearch()" />
  <kbd class="global-search__kbd" aria-hidden="true">{{ shortcutLabel }}</kbd>
</form>
