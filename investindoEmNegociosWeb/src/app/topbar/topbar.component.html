<header class="topbar">
  <button
    type="button"
    class="menu-toggle"
    aria-controls="app-sidebar"
    [attr.aria-expanded]="mobileMenuOpen()"
    aria-label="Abrir menu de navegação"
    (click)="menuToggle.emit()">
    @if (!mobileMenuOpen()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="20" height="20">
        <line x1="4" y1="7" x2="20" y2="7"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="17" x2="20" y2="17"></line>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="20" height="20">
        <line x1="6" y1="6" x2="18" y2="18"></line>
        <line x1="6" y1="18" x2="18" y2="6"></line>
      </svg>
    }
  </button>
  <app-global-search class="topbar__search" />
  <div class="topbar__actions">
    @if (canUseAssistant()) {
      <a
        class="topbar__assistant"
        routerLink="/assistente"
        title="Abrir Assistente IA"
        (click)="reloadIfSame('/assistente', $event)">
        <svg viewBox="0 0 24 24" role="presentation" focusable="false" aria-hidden="true">
          <path d="M12 4c4.4 0 8 2.9 8 6.5S16.4 17 12 17c-.7 0-1.5-.1-2.2-.3L5 19l1.1-3.3C4.8 14.6 4 12.7 4 10.5 4 6.9 7.6 4 12 4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9 10.5h.01M12 10.5h.01M15 10.5h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
        <span class="topbar__assistant-label">Assistente IA</span>
      </a>
    }
    <button
      type="button"
      class="topbar__icon-btn"
      (click)="financialValuesToggle.emit()"
      [attr.aria-pressed]="financialValuesHidden()"
      [attr.aria-label]="financialValuesHidden() ? 'Exibir valores financeiros' : 'Ocultar valores financeiros'"
      [attr.title]="financialValuesHidden() ? 'Exibir valores financeiros' : 'Ocultar valores financeiros'">
      @if (financialValuesHidden()) {
        <svg viewBox="0 0 24 24" role="presentation" focusable="false" aria-hidden="true">
          <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.1 3.9M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.9 9.9 0 0 0 4.4-1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" role="presentation" focusable="false" aria-hidden="true">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7" />
        </svg>
      }
    </button>
    <button
      type="button"
      class="topbar__icon-btn"
      (click)="themeToggle.emit()"
      [attr.aria-label]="isLightTheme() ? 'Ativar tema escuro' : 'Ativar tema claro'"
      [attr.title]="isLightTheme() ? 'Ativar tema escuro' : 'Ativar tema claro'">
      @if (isLightTheme()) {
        <svg viewBox="0 0 24 24" role="presentation" focusable="false" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" role="presentation" focusable="false" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      }
    </button>
    <app-notification-bell
      [open]="notificationsOpen()"
      [loading]="notificationsLoading()"
      [error]="notificationsError()"
      [items]="notifications()"
      [unreadCount]="unreadCount()"
      (toggleRequested)="notificationsToggle.emit()"
      (refreshRequested)="notificationsRefresh.emit()"
      (itemRead)="notificationRead.emit($event)" />
    <span class="topbar__divider" aria-hidden="true"></span>
    <app-user-menu
      [open]="userMenuOpen()"
      [avatarUrl]="avatarUrl()"
      [initials]="userInitials()"
      [displayName]="displayName()"
      [role]="currentRole()"
      (toggleRequested)="userMenuToggle.emit()"
      (routeReload)="routeReload.emit($event)"
      (logoutRequested)="logoutRequested.emit()" />
  </div>
</header>
