<a class="site-header__brand" routerLink="/" [attr.aria-label]="brandName()">
  <img class="site-header__logo" [src]="logoSrc()" alt="" width="32" height="32" />
  <span class="site-header__wordmark">{{ brandName() }}</span>
</a>

@if (links().length) {
  <nav class="site-header__nav" aria-label="Seções da página">
    @for (link of links(); track link.label) {
      @if (link.route) {
        <a class="site-header__link" [routerLink]="link.route">{{ link.label }}</a>
      } @else {
        <a
          class="site-header__link"
          [href]="'#' + link.anchor"
          (click)="onAnchor(link.anchor!, $event)"
          >{{ link.label }}</a
        >
      }
    }
  </nav>
}

<div class="site-header__actions">
  <a appSiteCta variant="quiet" size="sm" [routerLink]="loginRoute()">{{ loginLabel() }}</a>
  <a appSiteCta variant="primary" size="sm" [href]="ctaAnchor()">{{ ctaLabel() }}</a>
</div>
