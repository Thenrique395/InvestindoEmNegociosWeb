<section class="admin-users">
  <header class="admin-users__header">
    <div>
      <h1>Controle de acessos</h1>
      <p>Defina o nível de acesso de cada usuário.</p>
    </div>
    <button type="button" class="btn-primary sm" (click)="load()" [disabled]="loading">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path
            d="M20 12a8 8 0 0 1-13.66 5.66M4 12A8 8 0 0 1 17.66 6.34"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round" />
          <path
            d="M20 6v5h-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </span>
      Atualizar
    </button>
  </header>

  <div class="status" *ngIf="loading">Carregando usuários...</div>
  <div class="status error" *ngIf="error">{{ error }}</div>

  <div class="table-wrap" *ngIf="!loading && users.length">
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Status</th>
          <th>Criado em</th>
          <th>Nível</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span [class.inactive]="!user.isActive">{{ user.isActive ? 'Ativo' : 'Inativo' }}</span>
          </td>
          <td>{{ user.createdAt | date: 'short' }}</td>
          <td>
            <select
              [(ngModel)]="user.pendingRole"
              (ngModelChange)="updateRole(user, $event)"
              [disabled]="savingId === user.id || deletingId === user.id">
              <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
            </select>
          </td>
          <td>
            <div class="actions">
              <button
                type="button"
                class="btn-warning sm"
                (click)="toggleStatus(user)"
                [disabled]="savingId === user.id || deletingId === user.id">
                <span class="icon" aria-hidden="true">
                  <svg *ngIf="user.isActive" viewBox="0 0 24 24" focusable="false">
                    <path
                      d="M7 11V8a5 5 0 0 1 10 0v3"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round" />
                    <rect x="5" y="11" width="14" height="9" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" />
                  </svg>
                  <svg *ngIf="!user.isActive" viewBox="0 0 24 24" focusable="false">
                    <path
                      d="M17 11V8a5 5 0 0 0-9.9-1"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round" />
                    <rect x="5" y="11" width="14" height="9" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" />
                  </svg>
                </span>
                {{ user.pendingActive ? 'Bloquear' : 'Desbloquear' }}
              </button>
              <button
                type="button"
                class="btn-primary sm"
                (click)="saveChanges(user)"
                [disabled]="!user.dirty || savingId === user.id || deletingId === user.id">
                <span class="icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path
                      d="M5 12l4 4 10-10"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg>
                </span>
                Salvar
              </button>
              <button
                type="button"
                class="btn-danger sm"
                (click)="removeUser(user)"
                [disabled]="savingId === user.id || deletingId === user.id">
                <span class="icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path
                      d="M4 7h16M9 7V5h6v2M8 7l1 12h6l1-12"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg>
                </span>
                Excluir
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="status empty" *ngIf="!loading && !users.length">Nenhum usuário encontrado.</div>
</section>
