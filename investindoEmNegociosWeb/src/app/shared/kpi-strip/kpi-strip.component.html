@for (item of items(); track item.label; let first = $first) {
  <div class="kpi" [class.kpi--feature]="first && featureFirst()">
    <div class="kpi__head">
      @if (item.icon) {
        <span class="kpi__icon" [attr.data-tone]="item.tone || 'neutral'" aria-hidden="true">
          {{ item.icon }}
        </span>
      }
      <span class="kpi__label">{{ item.label }}</span>
      <button
        type="button"
        class="kpi__help"
        [attr.title]="item.tooltip"
        [attr.aria-label]="'Como ' + item.label + ' é calculado'">
        ?
      </button>
    </div>

    <p class="kpi__value tabular" [attr.data-tone]="item.tone || 'neutral'">{{ item.value }}</p>

    @if (item.note) {
      <p class="kpi__note">{{ item.note }}</p>
    }
  </div>
}
