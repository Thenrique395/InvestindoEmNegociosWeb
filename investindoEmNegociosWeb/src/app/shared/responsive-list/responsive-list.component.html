<!-- Desktop (tabela) -->
<div class="overflow-x-auto max-md:hidden" *ngIf="items.length; else emptyState">
  <table class="min-w-full text-sm">
    <thead>
      <tr class="border-b border-[var(--border)] text-left text-[var(--text-muted)]">
        <th *ngFor="let col of columns" class="py-2 px-3" [ngClass]="alignClass(col)">
          {{ col.label }}
        </th>
      </tr>
    </thead>

    <tbody>
      <ng-container *ngFor="let item of items; trackBy: trackByItem">
        <tr *ngIf="!desktopRowTemplate" class="border-b border-[var(--border)]/60 text-[var(--text)]">
          <td *ngFor="let col of columns" class="py-2 px-3" [ngClass]="alignClass(col)">
            {{ getValue(item, col) }}
          </td>
        </tr>

        <ng-container *ngIf="desktopRowTemplate" [ngTemplateOutlet]="desktopRowTemplate" [ngTemplateOutletContext]="{ $implicit: item, item: item }"></ng-container>
      </ng-container>
    </tbody>
  </table>
</div>

<!-- Mobile (cards) -->
<div class="hidden gap-3 max-md:grid" *ngIf="items.length">
  <ng-container *ngFor="let item of items; trackBy: trackByItem">
    <article
      *ngIf="!mobileCardTemplate"
      class="rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-3 shadow-[var(--shadow-sm)]">
      <div *ngFor="let col of columns" class="mb-2">
        <span class="text-xs text-[var(--text-muted)]">{{ col.label }}</span>
        <div class="text-sm font-medium text-[var(--text)]">
          {{ getValue(item, col) }}
        </div>
      </div>
    </article>

    <ng-container *ngIf="mobileCardTemplate" [ngTemplateOutlet]="mobileCardTemplate" [ngTemplateOutletContext]="{ $implicit: item, item: item }"></ng-container>
  </ng-container>
</div>

<ng-template #emptyState>
  <div class="rounded-xl border border-[var(--border)] bg-[var(--surface)] p-4 text-sm text-[var(--text-muted)]">
    <strong class="block text-[var(--text)]">{{ emptyTitle }}</strong>
    <span>{{ emptyDescription }}</span>
  </div>
</ng-template>
