<section class="grid gap-4">
  <!-- ... restante omitido para foco ... -->

  <section class="rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-4 shadow-[var(--shadow-sm)]">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-[var(--text)]">Minhas contas</h2>
      <button type="button" class="btn-ghost sm" (click)="loadAccounts()">Atualizar</button>
    </div>

    <div class="grid gap-3 md:grid-cols-2" *ngIf="!loading && hasAccounts">
      <article
        *ngFor="let account of accounts"
        class="rounded-xl border border-[var(--border)] bg-[var(--surface-2)] p-4">
        <div class="flex items-start justify-between gap-2">
          <div>
            <h3 class="text-base font-semibold text-[var(--text)]">{{ account.name }}</h3>
            <p class="text-xs text-[var(--text-muted)]">{{ accountTypeLabel(account.type) }}</p>
          </div>

          <!-- 🔥 NOVO PADRÃO -->
          <app-status-badge
            [tone]="account.isActive ? 'success' : 'muted'"
            [label]="account.isActive ? 'Ativa' : 'Inativa'">
          </app-status-badge>
        </div>

        <div class="mt-3 grid gap-1 text-sm text-[var(--text)]">
          <p>Saldo inicial: <strong>R$ {{ account.initialBalance | number:'1.2-2' }}</strong></p>
          <p>Saldo atual: <strong>R$ {{ account.currentBalance | number:'1.2-2' }}</strong></p>
        </div>

        <div class="mt-3 flex flex-wrap gap-2">
          <button type="button" class="btn-ghost sm" (click)="selectAccount(account.id)">Ver extrato</button>
          <button type="button" class="btn-ghost sm" (click)="startEdit(account)">Editar</button>
          <button type="button" class="btn-danger sm" (click)="remove(account)">Remover</button>
        </div>
      </article>
    </div>
  </section>
</section>
