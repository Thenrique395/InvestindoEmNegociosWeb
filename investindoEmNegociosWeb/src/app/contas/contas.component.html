<section class="grid gap-4">
  <header class="rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-4 shadow-[var(--shadow-sm)]">
    <h1 class="text-xl font-semibold text-[var(--text)]">Contas</h1>
    <p class="text-sm text-[var(--text-muted)]">Cadastre contas e acompanhe saldo atual por movimentações.</p>
  </header>

  <app-account-form
    [form]="form"
    [editingId]="editingId"
    [saving]="saving"
    [accountTypes]="accountTypes"
    [nameError]="accountNameError"
    [typeError]="accountTypeError"
    [balanceError]="initialBalanceError"
    [submitted]="formSubmitted"
    (save)="save()"
    (clear)="startCreate()"
    (touchField)="markAccountFieldTouched($event)">
  </app-account-form>

  <p *ngIf="error" class="rounded-xl border border-[var(--danger)]/30 bg-[var(--danger)]/10 p-3 text-sm text-[var(--danger)]">
    {{ error }}
  </p>

  <app-account-transfer
    [accounts]="accounts"
    [value]="transferForm"
    [transferring]="transferring"
    (valueChange)="onTransferChange($event)"
    (submitTransfer)="transfer()">
  </app-account-transfer>

  <section class="rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-4 shadow-[var(--shadow-sm)]">
    <app-account-list
      [accounts]="accounts"
      [loading]="loading"
      (refresh)="loadAccounts()"
      (create)="startCreate()"
      (selectAccount)="selectAccount($event)"
      (edit)="startEdit($event)"
      (remove)="remove($event)">
    </app-account-list>
  </section>

  <!-- restante mantido igual -->
</section>
