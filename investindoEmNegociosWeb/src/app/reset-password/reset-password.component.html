<section class="panel">
  <div class="panel__header">
    <div>
      <p class="eyebrow">Recuperação de senha</p>
      <h2>Definir nova senha</h2>
      <p class="muted">Escolha uma nova senha para acessar sua conta.</p>
    </div>
  </div>

  <form class="form" (ngSubmit)="onSubmit()">
    <label>
      Nova senha
      <input [(ngModel)]="newPassword" name="newPassword" type="password" required minlength="8" />
    </label>

    <label>
      Confirmar nova senha
      <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" required minlength="8" />
    </label>

    <div class="actions">
      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Salvando...' : 'Redefinir senha' }}
      </button>
      <a routerLink="/login" class="ghost-link">Voltar para login</a>
    </div>
  </form>
</section>
