name: Deploy Frontend Production

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Imagem GHCR para publicar em PRD. Vazio usa o SHA selecionado no workflow."
        required: false
        type: string
      confirm:
        description: 'Ambiente PRD pausado temporariamente (ver docs/DECISIONS/2026-06-15-pausar-ambiente-prd-focar-dev.md). Digite "DEPLOY" para liberar este deploy.'
        required: true
        type: string

concurrency:
  group: frontend-production-delivery
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/thenrique395/investindoemnegociosweb
  DEPLOY_PATH: /home/ubuntu/InvestindoEmNegociosWeb

jobs:
  resolve-image:
    name: Resolve Production Image
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Resolve image ref
        id: image
        env:
          INPUT_IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_IMAGE_REF:-}" ]; then
            echo "image_ref=${INPUT_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "image_ref=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

  deploy-prd:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: resolve-image
    environment: production
    # Ambiente PRD pausado temporariamente — ver docs/DECISIONS/2026-06-15-pausar-ambiente-prd-focar-dev.md.
    # Exige digitar "DEPLOY" no input `confirm` para liberar este job.
    if: ${{ inputs.confirm == 'DEPLOY' }}
    outputs:
      frontend_port: ${{ steps.config.outputs.frontend_port }}
      api_base_url: ${{ steps.config.outputs.api_base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export environment config
        id: config
        env:
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "frontend_port=${FRONTEND_PORT}" >> "$GITHUB_OUTPUT"
          echo "api_base_url=${API_BASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Upload compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy frontend to production
        uses: appleboy/ssh-action@v1.0.3
        env:
          STACK_NAME: invest-web-prd
          FRONTEND_IMAGE: ${{ needs.resolve-image.outputs.image_ref }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: STACK_NAME,FRONTEND_IMAGE,FRONTEND_PORT,API_BASE_URL,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            FRONTEND_PORT="$(printf '%s' "${FRONTEND_PORT:-}" | tr -d '[:space:]')"
            if ! printf '%s' "$FRONTEND_PORT" | grep -Eq '^[0-9]+$'; then
              echo "FRONTEND_PORT must be numeric."
              exit 1
            fi
            export FRONTEND_PORT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker rm -f investindoemnegociosweb-frontend-1 >/dev/null 2>&1 || true
            docker compose -p "$STACK_NAME" config >/dev/null
            docker compose -p "$STACK_NAME" pull
            docker compose -p "$STACK_NAME" up -d --no-build --force-recreate --remove-orphans

  validate-prd:
    name: Validate Production Frontend
    needs: deploy-prd
    uses: ./.github/workflows/quality-tests.yml
    with:
      suite: post-deploy
      frontend_port: ${{ needs.deploy-prd.outputs.frontend_port }}
      expected_api_base_url: ${{ needs.deploy-prd.outputs.api_base_url }}
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
