name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-delivery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/thenrique395/investindoemnegociosweb
  DEPLOY_PATH: /home/ubuntu/InvestindoEmNegociosWeb
  NODE_VERSION: "24.x"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: investindoEmNegociosWeb/package-lock.json

      - name: Validate frontend quality gate
        run: bash ./scripts/quality-frontend.sh

  build-and-push:
    name: Build And Push Image
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          echo "image_ref=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./investindoEmNegociosWeb
          file: ./investindoEmNegociosWeb/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ env.IMAGE_NAME }}:main

  deploy-dev:
    name: Deploy Development
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy frontend to development
        uses: appleboy/ssh-action@v1.0.3
        env:
          STACK_NAME: invest-web-dev
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: STACK_NAME,FRONTEND_IMAGE,FRONTEND_PORT,API_BASE_URL,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            FRONTEND_PORT="$(printf '%s' "${FRONTEND_PORT:-}" | tr -d '[:space:]')"
            if ! printf '%s' "$FRONTEND_PORT" | grep -Eq '^[0-9]+$'; then
              echo "FRONTEND_PORT must be numeric."
              exit 1
            fi
            export FRONTEND_PORT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -p "$STACK_NAME" config >/dev/null
            docker compose -p "$STACK_NAME" pull
            docker compose -p "$STACK_NAME" up -d --no-build --force-recreate --remove-orphans

  deploy-prd:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs:
      - build-and-push
      - deploy-dev
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy frontend to production
        uses: appleboy/ssh-action@v1.0.3
        env:
          STACK_NAME: invest-web-prd
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: STACK_NAME,FRONTEND_IMAGE,FRONTEND_PORT,API_BASE_URL,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            FRONTEND_PORT="$(printf '%s' "${FRONTEND_PORT:-}" | tr -d '[:space:]')"
            if ! printf '%s' "$FRONTEND_PORT" | grep -Eq '^[0-9]+$'; then
              echo "FRONTEND_PORT must be numeric."
              exit 1
            fi
            export FRONTEND_PORT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -p "$STACK_NAME" config >/dev/null
            docker compose -p "$STACK_NAME" pull
            docker compose -p "$STACK_NAME" up -d --no-build --force-recreate --remove-orphans
