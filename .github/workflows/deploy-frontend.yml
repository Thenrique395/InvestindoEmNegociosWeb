name: Deploy Frontend

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./investindoEmNegociosWeb
          file: ./investindoEmNegociosWeb/Dockerfile
          push: true
          tags: ghcr.io/thenrique395/investindoemnegociosweb:latest

      - name: Upload compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/InvestindoEmNegociosWeb"

      - name: Deploy frontend on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /home/ubuntu/InvestindoEmNegociosWeb
            cd /home/ubuntu/InvestindoEmNegociosWeb
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            docker compose pull
            # limpa conflitos de nome e containers órfãos de execuções anteriores
            docker rm -f investindoemnegociosweb-frontend-1 >/dev/null 2>&1 || true
            docker compose down --remove-orphans || true
            docker compose up -d --no-build --force-recreate --remove-orphans
