services:
  backend:
    build:
      context: ../InvestindoEmNegocio
      dockerfile: Dockerfile
    ports:
      - "5059:5059"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5059
      ConnectionStrings__Default: ${DB_CONN}
      Jwt__Issuer: InvestindoEmNegocio
      Jwt__Audience: InvestindoEmNegocio
      Jwt__SecretKey: ${JWT_SECRET}
      OTEL_SERVICE_NAME: InvestindoEmNegocio
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5059/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./investindoEmNegociosWeb
      dockerfile: Dockerfile
    ports:
      - "4200:4000"
    environment:
      PORT: 4000
      API_BASE_URL: http://backend:5059/api
    depends_on:
      backend:
        condition: service_healthy
